# git-cliff config: https://git-cliff.org/docs/configuration
# Commits must follow Conventional Commits (enforced by .githooks/commit-msg and CI).

[changelog]
header = """
# Changelog

All notable changes to AEInfinityBooster are listed here.\n
"""
body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits -%}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{% if commit.breaking %}[**breaking**] {% endif %}{{ commit.message | upper_first }}
{% endfor -%}
{% endfor %}
"""
trim = true
footer = ""

[git]
conventional_commits = true
# The history before 2.0.0 predates Conventional Commits, so it's left out
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
commit_parsers = [
    { message = "^chore\\(release\\)", skip = true },
    { message = "^feat", group = "<!-- 0 -->Features" },
    { message = "^fix", group = "<!-- 1 -->Bug Fixes" },
    { message = "^perf", group = "<!-- 2 -->Performance" },
    { message = "^refactor", group = "<!-- 3 -->Refactoring" },
    { message = "^docs", group = "<!-- 4 -->Documentation" },
    { message = "^test", group = "<!-- 5 -->Tests" },
    { message = "^build", group = "<!-- 6 -->Build" },
    { message = "^ci", group = "<!-- 7 -->CI" },
    { message = "^style", group = "<!-- 8 -->Styling" },
    { message = "^revert", group = "<!-- 9 -->Reverts" },
    { message = "^chore", group = "<!-- 10 -->Miscellaneous" },
]
