modLoader="javafml"
loaderVersion="[1,)"
license="${license}"
issueTrackerURL="https://github.com/Hexeption/AEInfinityBooster/issues"

[[mods]]
modId="${id}"
version="${version}"
displayName="${name}"
authors="${authors}"
description='''${description}'''
logoFile="assets/${id}/icon.png"
logoBlur=false

[[mixins]]
config="${id}.mixins.json"

[[dependencies.${id}]]
modId="neoforge"
type="required"
versionRange="${neoforgeVersionRange}"
ordering="NONE"
side="BOTH"

[[dependencies.${id}]]
modId="minecraft"
type="required"
versionRange="[${minecraftVersion}]"
ordering="NONE"
side="BOTH"

[[dependencies.${id}]]
modId="ae2"
type="required"
versionRange="${ae2VersionRange}"
ordering="AFTER"
side="BOTH"
