name: Java CI with Gradle

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish every version to CurseForge and Modrinth"
        type: boolean
        default: false

jobs:
  commits:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Checks only commits that are new in this push or PR; history from before 2.0.0 isn't conventional
      - name: Check commits follow Conventional Commits
        env:
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ -n "$PR_BASE" ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            range="$BEFORE..$GITHUB_SHA"
          else
            range="$(git merge-base "origin/$DEFAULT_BRANCH" "$GITHUB_SHA")..$GITHUB_SHA"
          fi
          failed=0
          for sha in $(git rev-list --no-merges "$range"); do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/msg"
            if ! .githooks/commit-msg "$RUNNER_TEMP/msg"; then
              echo "::error::Commit ${sha:0:7} doesn't follow Conventional Commits"
              failed=1
            fi
          done
          exit $failed

  # Every folder in versions/ is one Minecraft version and loader, and gets its own build and publish job
  versions:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@v7
      - id: list
        run: echo "list=$(ls versions | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  build:
    needs: versions
    name: build (${{ matrix.version }})
    runs-on: ubuntu-latest
    # A game test that never finishes keeps the server running, so don't let one eat hours of runner time
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJson(needs.versions.outputs.list) }}
    steps:
      - uses: actions/checkout@v7
      # 1.16.5 builds with 8, 1.18.2 to 1.20.4 with 17, 1.20.5 to 1.21.1 need 21, and 26.x needs 25
      - name: Setup JDKs
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: |
            8
            17
            21
            25
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      # Configure on demand keeps Loom from setting up every other version in this job too
      - name: Build
        run: ./gradlew --configure-on-demand ":${{ matrix.version }}:build"
      # Skipped on 1.16.5, which has no game test framework
      - name: Run game tests
        run: ./gradlew --configure-on-demand ":${{ matrix.version }}:runGameTestServer"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.version }}
          path: versions/${{ matrix.version }}/build/libs/*.jar

  publish:
    needs: [versions, build]
    name: publish (${{ matrix.version }})
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJson(needs.versions.outputs.list) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Stonecraft uploads CHANGELOG.md as the release notes, so cut it down to just this release
      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: ${{ startsWith(github.ref, 'refs/tags/v') && '--latest' || '--unreleased' }} --strip header
        env:
          OUTPUT: CHANGELOG.md
      - name: Setup JDKs
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: |
            8
            17
            21
            25
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      # A v1.2.3 tag publishes as version 1.2.3; a manual run uses mod.version from gradle.properties
      - name: Publish
        run: |
          task=":${{ matrix.version }}:publishMods"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            ./gradlew --configure-on-demand "$task" "-Pmod.version=${GITHUB_REF_NAME#v}"
          else
            ./gradlew --configure-on-demand "$task"
          fi
        env:
          DO_PUBLISH: "true"
          CURSEFORGE_TOKEN: ${{ secrets.CURSE_API_KEY }}
          CURSEFORGE_ID: "559313"
          CURSEFORGE_SLUG: "aeinfinitybooster"
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_API_KEY }}
          MODRINTH_ID: "VQhDBNs8"

  # Posts the release to #releases on Discord and pings the mod's role
  announce:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: CHANGELOG.md
      - name: Post to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_RELEASES_WEBHOOK }}
          ROLE_ID: "1563179216231735418"
          MOD_NAME: "AE Infinity Booster"
          MODRINTH_URL: "https://modrinth.com/mod/aeinfinitybooster"
          CURSEFORGE_URL: "https://www.curseforge.com/minecraft/mc-mods/aeinfinitybooster"
        run: |
          jq -n --arg role "$ROLE_ID" --arg name "$MOD_NAME" --arg version "${GITHUB_REF_NAME#v}" \
            --arg notes "$(head -c 3500 CHANGELOG.md)" --arg mr "$MODRINTH_URL" --arg cf "$CURSEFORGE_URL" '{
              content: "<@&\($role)>",
              allowed_mentions: {roles: [$role]},
              embeds: [{
                title: "\($name) \($version)",
                url: $mr,
                description: $notes,
                color: 10181046,
                fields: [{name: "Download", value: "[Modrinth](\($mr)) · [CurseForge](\($cf))"}]
              }]
            }' | curl -fsS -H "Content-Type: application/json" -d @- "$WEBHOOK"
